{{- if .Values.edgeGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "agentforge.fullname" . }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.edgeGateway.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.edgeGateway.listeners.http.port }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}