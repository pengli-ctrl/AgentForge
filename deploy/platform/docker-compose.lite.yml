services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - '5432:5432'
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentforge']
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - agentforge-valkey:/data

  temporal:
    image: temporalio/auto-setup:1.32.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agentforge
      POSTGRES_PWD: agentforge
      POSTGRES_SEEDS: postgres
    ports:
      - '7233:7233'

  temporal-ui:
    image: temporalio/ui:2.42.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - '8080:8080'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: agentforge
      MINIO_ROOT_PASSWORD: agentforge
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - agentforge-minio:/data

volumes:
  agentforge-postgres:
  agentforge-valkey:
  agentforge-minio:
