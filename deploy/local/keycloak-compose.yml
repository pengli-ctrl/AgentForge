services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
  oidc-mock:
    image: python:3.10-slim
    command: python -m http.server 8090
    working_dir: /srv
    volumes: ["./keycloak:/srv:ro"]
    ports: ["8090:8090"]
