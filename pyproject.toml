[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "3.1.0"
description = "事件驱动的多 Agent 编排框架——从单 Agent PoC 到事件驱动架构的完整演进实践"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "彭黎", email = "pl2847253@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "boto3>=1.34.0",
    "temporalio>=1.6.0",
    "aiokafka>=0.10.0",
    "litellm>=1.40.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "numpy>=1.24.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/pengli-ctrl/AgentForge"
Repository = "https://github.com/pengli-ctrl/AgentForge"
Documentation = "https://pengli-ctrl.github.io/blog"
"Bug Tracker" = "https://github.com/pengli-ctrl/AgentForge/issues"

[project.scripts]
agentforge = "agentforge.cli.main:main"

[tool.setuptools.packages.find]
include = ["agentforge*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["agentforge"]
known_third_party = ["fastapi", "httpx", "redis", "yaml", "numpy", "pytest"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "agentforge.platform.core.*",
    "agentforge.platform.sdk.*",
    "agentforge.platform.modules.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "infra: requires PostgreSQL, Temporal, MinIO, and Valkey",
]

[tool.coverage.run]
source = ["agentforge"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
