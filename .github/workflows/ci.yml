# AgentForge CI 流水线：代码检查、测试和镜像构建。
# 推送到 main/develop 或向 main 提交 PR 时触发。
#
# 测试任务会安装项目自身和完整运行时依赖，确保干净环境下
# platform 层的所有顶层导入都能真实解析。依赖安装使用缓存以缩短等待时间。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PY_COLORS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 代码检查 =====
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install linting and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # flake8 不读取 pyproject.toml，因此显式传入参数。
      # black 固定 target-version，避免 Python 3.10 解析更新语法时出现警告。
      - name: Run black (format check)
        run: black --check --target-version py310 agentforge/ tests/

      - name: Run isort (import order check)
        run: isort --check-only agentforge/ tests/

      - name: Run flake8 (style check)
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 agentforge/ tests/

      - name: Run mypy (type check)
        run: mypy agentforge/

  # ===== 测试 =====
  # 覆盖单元、集成和 platform 测试，不使用 continue-on-error。
  # 安装项目自身，保证干净 Runner 上 platform 层导入可以正常解析。
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full test suite (unit + integration + platform)
        run: |
          python -m pytest tests/ -v --tb=short --cov=agentforge --cov-report=term-missing

      - name: Verify Alembic migration chain (offline)
        run: python -m pytest tests/platform/test_migrations.py -q

  # ===== 语法检查 =====
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "*__pycache__*" -exec python3 -m py_compile {} \;
          echo "All Python files compiled successfully"

  # ===== Security Scan =====
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, syntax-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Bandit high-severity scan
        run: bandit -r agentforge -q -lll

      - name: Local secret and dangerous-call scan
        run: python scripts/security_scan.py

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: dist/security-scan.json

  # ===== Infrastructure Integration =====
  infra:
    name: Infrastructure Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint, test, syntax-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run real infrastructure tests
        run: bash scripts/run_infra_tests.sh

  # ===== Release Artifacts =====
  release:
    name: Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [lint, test, syntax-check, security]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify release metadata and migration head
        run: python scripts/verify_release.py

      - name: Build source distribution
        run: python -m build --sdist --outdir dist/python

      - name: Build deterministic wheel
        run: python scripts/build_wheel.py --output-dir dist/python

      - name: Check Python package metadata
        run: |
          python -m twine check dist/python/*.whl
          python -m twine check dist/python/*.tar.gz

      - name: Build deterministic private package
        run: python scripts/build_private_release.py --output-dir dist/private

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-release
          path: dist/

  # ===== Docker 构建 =====
  build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, syntax-check, infra, security]
    steps:
      - uses: actions/checkout@v7

      - name: Build versioned Docker image
        run: |
          VERSION=$(python3 -c "import re,pathlib; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'version = \"([^\"]+)\"', t).group(1))")
          docker build --build-arg APP_VERSION="$VERSION" -t "agentforge:$VERSION" .
          docker save "agentforge:$VERSION" | gzip -9 > "agentforge-image-$VERSION.tar.gz"

      - name: Upload container image artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-image
          path: agentforge-image-*.tar.gz
