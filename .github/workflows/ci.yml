# AgentForge CI 流水线 — lint + test + build
# 触发条件：push 到 main/develop 分支，或 PR 到 main 分支

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===== 代码检查 =====
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install black isort flake8 mypy

      - name: Run black (format check)
        run: black --check --line-length 100 agentforge/ tests/

      - name: Run isort (import order check)
        run: isort --check-only --profile black agentforge/ tests/

      - name: Run flake8 (style check)
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 agentforge/ tests/

      - name: Run mypy (type check)
        run: mypy --ignore-missing-imports --no-strict-optional agentforge/

  # ===== 测试 =====
  # 覆盖单元、集成与 platform 三层套件；不使用 continue-on-error，测试必须真实通过
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run full test suite (unit + integration + platform)
        run: |
          python -m pytest tests/ -v --tb=short --cov=agentforge --cov-report=term-missing

  # ===== 语法检查 =====
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "*__pycache__*" -exec python3 -m py_compile {} \;
          echo "All Python files compiled successfully"

  # ===== Docker 构建 =====
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, syntax-check]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentforge:ci .