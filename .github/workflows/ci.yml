# AgentForge CI 流水线：代码检查、测试和镜像构建。
# 推送到 main/develop 或向 main 提交 PR 时触发。
#
# 测试任务会安装项目自身和完整运行时依赖，确保干净环境下
# platform 层的所有顶层导入都能真实解析。依赖安装使用缓存以缩短等待时间。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PY_COLORS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 代码检查 =====
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      # flake8 不读取 pyproject.toml，因此显式传入参数。
      # black 固定 target-version，避免 Python 3.10 解析更新语法时出现警告。
      - name: Run black (format check)
        run: black --check --target-version py310 agentforge/ tests/

      - name: Run isort (import order check)
        run: isort --check-only agentforge/ tests/

      - name: Run flake8 (style check)
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 agentforge/ tests/

      - name: Run mypy (type check)
        run: mypy agentforge/

  # ===== 测试 =====
  # 覆盖单元、集成和 platform 测试，不使用 continue-on-error。
  # 安装项目自身，保证干净 Runner 上 platform 层导入可以正常解析。
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full test suite (unit + integration + platform)
        run: |
          python -m pytest tests/ -v --tb=short --cov=agentforge --cov-report=term-missing

  # ===== 语法检查 =====
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Compile all Python files
        run: |
          find . -name "*.py" -not -path "*__pycache__*" -exec python3 -m py_compile {} \;
          echo "All Python files compiled successfully"

  # ===== Docker 构建 =====
  build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, syntax-check]
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t agentforge:ci .
