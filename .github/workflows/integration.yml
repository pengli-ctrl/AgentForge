name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  compose-integration:
    name: Local Compose Integration
    env:
      AGENTFORGE_LOCAL_STACK: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Start integration stack
        run: docker compose -f deploy/local/docker-compose.integration.yml up -d --build mock-openai opa valkey
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8010/health && curl -fsS http://localhost:8181/health && exit 0
            sleep 2
          done
          exit 1
      - name: Run integration tests
        run: python -m pytest tests/integration -q
      - name: Stop integration stack
        if: always()
        run: docker compose -f deploy/local/docker-compose.integration.yml down -v

  security-integration:
    name: Security Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Start OPA and Valkey
        run: docker compose -f deploy/local/docker-compose.integration.yml up -d opa valkey
      - name: Run security and rate-limit tests
        run: python -m pytest tests/platform/test_opa_adapter.py tests/platform/test_oidc_auth.py tests/platform/test_distributed_rate_limit.py -q
      - name: Stop security stack
        if: always()
        run: docker compose -f deploy/local/docker-compose.integration.yml down -v

  observability-integration:
    name: Observability Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Start observability stack
        run: docker compose -f deploy/local/observability/docker-compose.yml up -d otel-collector
      - name: Run trace and prompt tests
        run: python -m pytest tests/platform/test_genai_attributes.py tests/platform/test_prompt_registry.py -q
      - name: Stop observability stack
        if: always()
        run: docker compose -f deploy/local/observability/docker-compose.yml down -v

  gateway-kind:
    name: Kind Envoy Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          config: deploy/local/kind-envoy.yaml
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install Envoy Gateway
        run: |
          helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.2.0 --namespace envoy-gateway-system --create-namespace
      - name: Validate Gateway manifests
        run: |
          helm template agentforge deploy/helm/agentforge --set edgeGateway.enabled=true > /tmp/agentforge.yaml
          kubectl apply --dry-run=server -f /tmp/agentforge.yaml
      - name: Wait for Envoy Gateway
        run: kubectl wait --for=condition=Available deployment --all -n envoy-gateway-system --timeout=300s

  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-24.04
    needs: [compose-integration, security-integration, observability-integration, gateway-kind]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check comment semantics
        run: python scripts/check_comment_semantics.py
      - name: Verify integration wiring
        run: python scripts/check_ci_integration_gate.py
